name: tests

on:
  workflow_call:
    inputs:
      run_integration:
        description: Also run the BFF integration tests
        type: boolean
        default: false

env:
  SOLUTION: LupiraTasksBff.slnx
  INTEGRATION_PROJECT: tests/LupiraTasksBff.IntegrationTests

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test ${{ env.SOLUTION }} -c Release

  integration:
    if: ${{ inputs.run_integration }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test ${{ env.INTEGRATION_PROJECT }} -c Release

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm i -g npm@12
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
